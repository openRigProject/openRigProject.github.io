name: Update YSFHosts.json

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert YSF reflectors
        env:
          DVREF_TOKEN: ${{ secrets.DVREF_TOKEN }}
        run: |
          set -o pipefail

          http_code=$(curl -sL -o /tmp/dvref_raw.json -w '%{http_code}' \
            -H "Accept: application/json" \
            -H "Authorization: Token ${DVREF_TOKEN}" \
            -A "openRig-host-updater/1.0 (+https://github.com/openRigProject)" \
            "https://dvref.com/api/v2/ysf/reflectors/")

          if [ "$http_code" -ne 200 ]; then
            echo "::error::DVRef API returned HTTP ${http_code}"
            head -c 500 /tmp/dvref_raw.json
            exit 1
          fi

          jq '{
              "_meta": {
                "source": "DVRef",
                "source_url": "https://dvref.com/",
                "attribution": "Reflector data provided by DVRef.",
                "aup": "https://dvref.com/aup/"
              },
              "reflectors": [.data.reflectors[]|{designator,country,name,use_xx_prefix,description:(.description//""),user_count:(.user_count//"000"),port:(.port//42000),ipv4:(.ipv4//null),ipv6:(.ipv6//null)}]
            }' /tmp/dvref_raw.json > YSFHosts.json

          count=$(jq '.reflectors|length' YSFHosts.json)
          echo "Reflector count: ${count}"
          if [ "$count" -lt 1 ]; then
            echo "::error::No reflectors returned — aborting"
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add YSFHosts.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update YSFHosts.json $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
