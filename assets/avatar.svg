<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" fill="none">
  <style>
    .r  { stroke: #38bdf8; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .rf { stroke: #38bdf8; stroke-width: 4; fill: #0f172a; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect x="-10" y="-10" width="220" height="220" rx="44" fill="#0f172a"/>

  <!-- Radio body -->
  <rect class="rf" x="12" y="52" width="176" height="120" rx="9"/>

  <!-- Carry handle -->
  <path class="r" d="M 62 52 Q 62 32 100 32 Q 138 32 138 52"/>

  <!-- Feet -->
  <rect class="rf" x="22" y="167" width="22" height="11" rx="3"/>
  <rect class="rf" x="156" y="167" width="22" height="11" rx="3"/>

  <!-- Antenna base -->
  <rect class="rf" x="15" y="40" width="20" height="15" rx="2.5"/>

  <!-- Antenna lines -->
  <line class="r" x1="16" y1="41" x2="58" y2="-8"/>
  <line class="r" x1="28" y1="45" x2="70" y2="-4"/>
  <circle class="rf" cx="64" cy="-8" r="5"/>

  <!-- Speaker rings -->
  <circle class="rf" cx="72" cy="114" r="46"/>
  <circle class="r"  cx="72" cy="114" r="33"/>
  <circle class="r"  cx="72" cy="114" r="19"/>

  <!-- Spokes -->
  <line class="r" x1="72" y1="68" x2="72" y2="95"/>
  <line class="r" x1="72" y1="133" x2="72" y2="160"/>
  <line class="r" x1="26" y1="114" x2="53" y2="114"/>
  <line class="r" x1="91" y1="114" x2="118" y2="114"/>

  <!-- Center hub -->
  <circle class="rf" cx="72" cy="114" r="7"/>

  <!-- Screen -->
  <rect class="rf" x="128" y="64" width="48" height="30" rx="4"/>
  <rect class="r"  x="132" y="68" width="40" height="22" rx="2"/>

  <!-- Buttons 2×3 -->
  <rect class="rf" x="128" y="101" width="14" height="10" rx="2"/>
  <rect class="rf" x="147" y="101" width="14" height="10" rx="2"/>
  <rect class="rf" x="166" y="101" width="14" height="10" rx="2"/>
  <rect class="rf" x="128" y="116" width="14" height="10" rx="2"/>
  <rect class="rf" x="147" y="116" width="14" height="10" rx="2"/>
  <rect class="rf" x="166" y="116" width="14" height="10" rx="2"/>

  <!-- Large knob bottom right -->
  <circle class="rf" cx="170" cy="148" r="16"/>
  <circle class="r"  cx="170" cy="148" r="9"/>
  <line   class="r"  x1="170" y1="139" x2="170" y2="132"/>
</svg>
