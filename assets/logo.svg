<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Icon mark -->
  <!-- Outer signal arc -->
  <path d="M 18 40 A 22 22 0 0 1 62 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Mid signal arc -->
  <path d="M 24 40 A 16 16 0 0 1 56 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <!-- Inner signal arc -->
  <path d="M 30 40 A 10 10 0 0 1 50 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Antenna mast -->
  <line x1="40" y1="30" x2="40" y2="56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="33" y1="56" x2="47" y2="56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Dot/transmitter -->
  <circle cx="40" cy="30" r="3" fill="#38bdf8"/>

  <!-- Wordmark -->
  <!-- "open" in muted -->
  <text x="78" y="51" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#94a3b8">open</text>
  <!-- "Rig" in accent -->
  <text x="161" y="51" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#38bdf8">Rig</text>
</svg>
